<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Globe Org">
  <title>Organizații Globale</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=28">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/globe.gl"></script>
</head>
<body>
  <div id="signature">Popa Bogdan</div>
  <div id="tap-chip"></div>
  <div id="visa-counters" aria-live="polite">
    <div class="visa-counter visa-counter-green">
      <span class="visa-counter-number" id="count-exempt">0</span>
      <span class="visa-counter-label">țări <b>NU</b> au nevoie de viză</span>
    </div>
    <div class="visa-counter visa-counter-red">
      <span class="visa-counter-number" id="count-required">0</span>
      <span class="visa-counter-label">țări au nevoie de viză</span>
    </div>
    <div class="visa-counter-note">Conf. Reg. (UE) 2018/1806</div>
  </div>
  <div id="overseas-info">
    <div class="overseas-info-header"><span id="overseas-info-name"></span> <span id="overseas-info-count"></span></div>
    <div id="overseas-info-list"></div>
  </div>
  <div id="ui-container">
    <h1>Organizații Globale</h1>
    <p>Selectați o organizație pentru a vedea țările membre pe glob (marcate cu verde).</p>
    <div id="search-container">
      <input type="text" id="country-search" placeholder="🔍 Caută o țară..." autocomplete="off" spellcheck="false">
      <div id="search-results"></div>
    </div>
    <div id="button-group">
      <button data-org="none" class="active">Resetare (Toate)</button>
      <button data-org="schengen_viza" class="schengen-viza-btn">Țări care au nevoie de viză în spațiul Schengen</button>
      <button data-org="overseas">Teritoriile de peste mări</button>
      <div id="overseas-panel">
        <div class="overseas-title">Alege o țară pentru a-i vedea teritoriile:</div>
        <div id="overseas-list"></div>
      </div>
      <button data-org="schengen">Spațiul Schengen</button>
      <button data-org="eu">Uniunea Europeană (UE)</button>
      <button data-org="coe">Consiliul Europei</button>
      <button data-org="eu_council">Consiliul European</button>
      <button data-org="eea">Spațiul SEE (Spațiul Economic European)</button>
      <button data-org="ocde">OCDE (Org. pt. Cooperare și Dezvoltare Economică)</button>
      <button data-org="nato">NATO (Organizația Tratatului Atlanticului de Nord)</button>
      <button data-org="onu">ONU (Organizația Națiunilor Unite)</button>
      <button data-org="osce">OSCE (Organizația pentru Securitate și Cooperare în Europa)</button>
      <button data-org="interpol">INTERPOL</button>
      <button data-org="oms">OMS (Org. Mondială a Sănătății)</button>
      <button data-org="unhcr">UNHCR (Înaltul Comisariat al ONU pt. Refugiați)</button>
      <button data-org="fmi">FMI (Fondul Monetar Internațional)</button>
      <button data-org="arab_league">Liga Arabă</button>
      <button data-org="unesco">UNESCO (Org. Națiunilor Unite pt. Educație, Știință și Cultură)</button>
      <button data-org="csi">CSI (Comunitatea Statelor Independente)</button>
      <button data-org="mercosur">MERCOSUR (Piața Comună a Sudului)</button>
      <button data-org="frontex">FRONTEX (Agenția Europeană pt. Poliția de Frontieră)</button>
    </div>
  </div>
  <div id="globe-container"></div>
  <script src="script.js?v=28"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
